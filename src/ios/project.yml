name: EspressU

options:
  bundleIdPrefix: com.am4rdev
  deploymentTarget:
    iOS: '15.0'
  xcodeVersion: '15.0'

settings:
  PRODUCT_NAME: EspressU
  PRODUCT_BUNDLE_IDENTIFIER: com.am4rdev.EspressU
  SDKROOT: iphoneos
  IPHONEOS_DEPLOYMENT_TARGET: '15.0'
  CODE_SIGN_IDENTITY: iPhone Developer
  CODE_SIGN_ENTITLEMENTS: Cemu.entitlements
  SWIFT_OBJC_BRIDGING_HEADER: Bridge/Cemu-Bridging-Header.h
  CLANG_ENABLE_MODULES: 'YES'
  HEADER_SEARCH_PATHS:
    - '$(SRCROOT)/Bridge'
  FRAMEWORK_SEARCH_PATHS:
    - '$(SRCROOT)/../../build-ios/out'
  LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks'
  GENERATE_INFOPLIST_FILE: 'YES'
  INFOPLIST_FILE: 'Info-AlternateIcons.plist'
  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MARKETING_VERSION: '1.0'
  CURRENT_PROJECT_VERSION: '1'
  INFOPLIST_KEY_CFBundleDisplayName: EspressU
  INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
  INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  INFOPLIST_KEY_GCSupportsControllerUserInteraction: 'YES'
  INFOPLIST_KEY_UIStatusBarHidden: 'YES'
  INFOPLIST_KEY_NSMicrophoneUsageDescription: 'EspressU uses the microphone only when a Wii U game asks for GamePad microphone input.'
  INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'EspressU pairs with this device for its built-in JIT, and connects to game servers on your local network when you use a custom server hosted at home.'
  INFOPLIST_KEY_NSHumanReadableCopyright: 'EspressU, built on Cemu'

packages:
  EspressUTouchLab:
    path: Packages/EspressUTouchLab

targets:
  EspressU:
    type: application
    platform: iOS
    deploymentTarget: '15.0'

    sources:
      - path: App
        type: group
      - path: Emulation
        type: group
      - path: Rendering
        type: group
      - path: Bridge
        type: group
        excludes:
          - '*.mm'
          - '*.cpp'
          - 'Core/**'
      - path: Resources
        type: group

    dependencies:
      - package: EspressUTouchLab
        product: TouchLabCore
      - package: EspressUTouchLab
        product: TouchLabUI
      - framework: ../../build-ios/out/Cemu.framework
        embed: true
      - framework: ../../dependencies/MoltenVK.xcframework
        embed: true
        link: false
      - framework: ../../dependencies/MoltenVK128.framework
        embed: true
        link: false
      - target: StikJITHelper
      - framework: ../../dependencies/StikJIT.xcframework
        embed: true
        link: false

    settings:
      base:
        HEADER_SEARCH_PATHS:
          - '$(inherited)'
          - '$(SRCROOT)/../../dependencies/idevice'
        LIBRARY_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../../dependencies/idevice'
        OTHER_LDFLAGS: '$(inherited) -Wl,-hidden-lidevice_ffi -framework Security -framework SystemConfiguration -framework CFNetwork -lresolv'
        DEAD_CODE_STRIPPING: 'YES'

    postBuildScripts:
      - name: Copy Cemu data files (shared fonts, game profiles) into the bundle
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../../ci/copy-bundle-data.sh"

    scheme:
      gatherCoverageData: false

  StikJITHelper:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.4'
    sources:
      - path: StikJITHelper
        type: group
    dependencies:
      - framework: ../../dependencies/StikJIT.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: StikJITHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.am4rdev.EspressU.StikJITHelper
        INFOPLIST_FILE: StikJITHelper/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_ENTITLEMENTS: ''
        SWIFT_OBJC_BRIDGING_HEADER: ''
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks'
